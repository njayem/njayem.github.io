<!-- Dark mode: apply saved/system theme before paint -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  .masthead__menu { position: relative; }
  .theme-toggle {
    position: absolute;
    top: 50%;
    right: 0.5em;
    transform: translateY(-50%);
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(128,128,128,0.4);
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    z-index: 20;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .theme-toggle:hover { background: rgba(128,128,128,0.18); transform: translateY(-50%) scale(1.08); }
  .greedy-nav { padding-right: 56px; }

  /* Back-to-top / go-to-bottom buttons */
  .to-top, .to-bottom {
    position: fixed;
    right: 20px; bottom: 20px;
    width: 44px; height: 44px;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.88);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #222;
    cursor: pointer;
    z-index: 50;
    opacity: 0; visibility: hidden;
    transform: translateY(10px) scale(0.9);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,0.16);
  }
  .to-bottom { bottom: 76px; }
  .to-top.show, .to-bottom.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
  .to-top:hover, .to-bottom:hover { background: #111; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.28); transform: translateY(-2px) scale(1.06); }
  .to-top svg, .to-bottom svg { display: block; }
  html[data-theme="dark"] .to-top, html[data-theme="dark"] .to-bottom { background: rgba(28,31,37,0.88); color: #e6e6e6; border-color: rgba(255,255,255,0.18); }
  html[data-theme="dark"] .to-top:hover, html[data-theme="dark"] .to-bottom:hover { background: #fff; color: #111; }
  @media (max-width: 600px) {
    .to-top, .to-bottom { width: 40px; height: 40px; right: 12px; }
    .to-top { bottom: 14px; }
    .to-bottom { bottom: 62px; }
  }

  /* Global mobile safety net */
  html, body { max-width: 100%; overflow-x: hidden; }
  .page__content pre, .page__content code { overflow-x: auto; max-width: 100%; word-break: break-word; }
  .page__content p, .page__content li, .page__content h1, .page__content h2, .page__content h3 { overflow-wrap: break-word; }
  .page__content table { width: 100%; max-width: 100%; }
  .page__content .table-btn { white-space: nowrap !important; overflow-wrap: normal !important; word-break: keep-all !important; }
  .page__content td:has(.table-btn) { white-space: nowrap; }
  .page__content table { table-layout: auto; border-collapse: collapse; }
  /* wrap between words; only split a word if it truly can't fit */
  .page__content td, .page__content th { overflow-wrap: break-word; word-break: normal; hyphens: manual; }
  @media (max-width: 700px) {
    /* fit the screen: no horizontal scrolling, text wraps inside the cells */
    .page__content table { display: table; width: 100% !important; font-size: 0.78em !important; }
    .page__content th, .page__content td { padding: 6px 5px !important; font-size: 1em !important; line-height: 1.3; }
    .page__content td:has(.table-btn), .page__content th:last-child { width: 1%; }
    .page__content .table-btn { font-size: 0.9em !important; padding: 4px 10px !important; }
  }
  @media (max-width: 600px) {
    .page__content h1, .page__title { font-size: 1.6em; }
    .page__content h2 { font-size: 1.3em; }
    .page__content th, .page__content td { padding: 8px 8px !important; font-size: 0.85em; }
    .page__inner-wrap, .page__content { padding-left: 0; padding-right: 0; }
    .initial-content, .page { padding-left: 0.9em; padding-right: 0.9em; }
    .research-section-tags { gap: 12px 10px; }
    .theme-toggle { width: 34px; height: 34px; font-size: 16px; right: 0.4em; }
    .greedy-nav { padding-right: 48px; }
  }

  html[data-theme="dark"],
  html[data-theme="dark"] #main,
  html[data-theme="dark"] .page__inner-wrap,
  html[data-theme="dark"] .page__content,
  html[data-theme="dark"] .archive,
  html[data-theme="dark"] .layout--single,
  html[data-theme="dark"] .layout--archive { background: #14161a !important; color: #e6e6e6; }
  html[data-theme="dark"] .page__title,
  html[data-theme="dark"] .page__lead,
  html[data-theme="dark"] .archive__subtitle,
  html[data-theme="dark"] .page__meta,
  html[data-theme="dark"] .page__footer-follow { color: #e6e6e6 !important; }
  html[data-theme="dark"] .page__footer { border-top-color: #2a2d33 !important; }
  html[data-theme="dark"] body,
  html[data-theme="dark"] .masthead,
  html[data-theme="dark"] .page,
  html[data-theme="dark"] .initial-content,
  html[data-theme="dark"] .page__footer,
  html[data-theme="dark"] .greedy-nav,
  html[data-theme="dark"] .greedy-nav .hidden-links { background: #14161a !important; color: #e6e6e6 !important; }
  html[data-theme="dark"] .masthead { border-bottom-color: #2a2d33 !important; }
  html[data-theme="dark"] .greedy-nav a,
  html[data-theme="dark"] .masthead__menu-item a { color: #e6e6e6 !important; }
  html[data-theme="dark"] .greedy-nav button { background: #2a2d33 !important; }
  html[data-theme="dark"] .page__content,
  html[data-theme="dark"] .page__content p,
  html[data-theme="dark"] .page__content li,
  html[data-theme="dark"] .page__content h1,
  html[data-theme="dark"] .page__content h2,
  html[data-theme="dark"] .page__content h3,
  html[data-theme="dark"] .page__title,
  html[data-theme="dark"] .archive__item-title,
  html[data-theme="dark"] .author__name,
  html[data-theme="dark"] .author__bio { color: #e6e6e6 !important; }
  html[data-theme="dark"] .page__content h2 { border-bottom-color: #2a2d33 !important; }
  html[data-theme="dark"] .page__content a { color: #6db3ff; }
  html[data-theme="dark"] .page__content th { background: #22252b !important; color: #e6e6e6 !important; }
  html[data-theme="dark"] .page__content td { background: #14161a; color: #e6e6e6 !important; }
  html[data-theme="dark"] .page__content th,
  html[data-theme="dark"] .page__content td { border-color: #2f333a !important; }
  html[data-theme="dark"] .photo-frame { border-color: #e6e6e6 !important; background: #14161a !important; }
  html[data-theme="dark"] .fa-github,
  html[data-theme="dark"] .fa-github-square { color: #fff !important; }

  /* Recommendation cards stay light, like the research cards */
  html[data-theme="dark"] .recommendation-card { background: #f9f9f9 !important; color: #000 !important; }
  html[data-theme="dark"] .page__content .recommendation-card p,
  html[data-theme="dark"] .recommendation-card .recommendation { color: #000 !important; }
  html[data-theme="dark"] .recommendation-card .role { color: grey !important; }
  html[data-theme="dark"] .recommendation-card .label,
  html[data-theme="dark"] .recommendation-card .label a { color: #fff !important; }

  /* Research cards stay exactly as in light mode; only the surroundings go dark */
  html[data-theme="dark"] .page__content .pub-card { background: #f9f9f9 !important; color: #000 !important; }
  html[data-theme="dark"] .page__content .pub-card .pub-title { color: #000 !important; }
  html[data-theme="dark"] .page__content .pub-card .pub-meta { color: #888 !important; }
  html[data-theme="dark"] .page__content .pub-card .pub-meta span { color: #333; }
  html[data-theme="dark"] .page__content .pub-card .pub-abstract-text { color: #555 !important; }
  html[data-theme="dark"] .page__content .pub-card .pub-abstract-label,
  html[data-theme="dark"] .page__content .pub-card .pub-abstract-empty { color: #bbb !important; }
  html[data-theme="dark"] .page__content .pub-card a:not([class*="btn"]):not(.pub-status-label) { color: #328de7; }
  html[data-theme="dark"] .page__content .pub-card .pub-card-preview-wrap { background: #fff !important; }
  html[data-theme="dark"] .sidebar,
  html[data-theme="dark"] .author__urls-wrapper,
  html[data-theme="dark"] .sidebar .author__urls-wrapper button { background: transparent !important; box-shadow: none !important; }
  @media (min-width: 1024px) {
    html[data-theme="dark"] .author__urls { background: transparent !important; box-shadow: none !important; border: 0 !important; }
  }
  @media (max-width: 1023px) {
    html[data-theme="dark"] .author__urls { background: #14161a !important; border-color: #2f333a !important; }
  }
  html[data-theme="dark"] .author__urls a,
  html[data-theme="dark"] .author__urls li,
  html[data-theme="dark"] .sidebar a { color: #e6e6e6 !important; }

  /* Section headings + tags on About page */
  html[data-theme="dark"] .page__content span[style*="#000;"] { color: #fff !important; -webkit-text-stroke-color: #fff !important; }
  html[data-theme="dark"] .page__content span[style*="#63287d"] { color: #c9a8ff !important; -webkit-text-stroke-color: #c9a8ff !important; }
  html[data-theme="dark"] .tag-mila { background: #c9a8ff !important; color: #1a1030 !important; }
  html[data-theme="dark"] .page__content span[style*="#102e70"] { color: #ff5a5a !important; -webkit-text-stroke-color: #ff5a5a !important; }
  html[data-theme="dark"] .tag-douglas { background: #d92b2b !important; color: #fff !important; }
  html[data-theme="dark"] .page__content p:has(> span[style*="#63287d"]) + p a { color: #c9a8ff !important; }
  html[data-theme="dark"] .page__content p:has(> span[style*="#102e70"]) + p a { color: #ff7a7a !important; }
  html[data-theme="dark"] .page__content p:has(> span[style*="#000;"]) + p a { color: #fff !important; text-decoration: underline; }
  html[data-theme="dark"] .affiliation-marquee { background: #fff !important; border-radius: 12px; }
  html[data-theme="dark"] .theme-toggle { border-color: rgba(255,255,255,0.35); }
</style>
