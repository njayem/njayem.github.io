{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      </button>
      <div id="scroll-nav" class="scroll-nav" role="group" aria-label="Scroll">
        <button id="to-top" class="scroll-nav__btn" type="button" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        <span class="scroll-nav__line" aria-hidden="true"></span>
        <button id="to-bottom" class="scroll-nav__btn" type="button" aria-label="Go to bottom" title="Go to bottom"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <script>
        (function () {
          var nav = document.getElementById('scroll-nav');
          var up = document.getElementById('to-top');
          var down = document.getElementById('to-bottom');
          document.body.appendChild(nav);
          function H() { return Math.max(document.body.scrollHeight, document.documentElement.scrollHeight); }
          function place() {
            var size = 38, right = 14;
            var vw = document.documentElement.clientWidth;
            if (vw >= 1024) {
              var gap = Math.max(0, (vw - 1280) / 2);
              right = Math.max(14, Math.round(gap / 2 - size / 2));
            }
            document.documentElement.style.setProperty('--ui-right', right + 'px');
          }
          function chk() {
            place();
            var y = window.pageYOffset || document.documentElement.scrollTop;
            var max = H() - window.innerHeight;
            nav.classList.toggle('show', max > 300);
            up.disabled = y < 80;
            down.disabled = y > max - 80;
          }
          window.addEventListener('scroll', chk, { passive: true });
          window.addEventListener('resize', chk);
          window.addEventListener('load', chk);
          document.addEventListener('DOMContentLoaded', chk);
          chk();
          up.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
          down.addEventListener('click', function () { window.scrollTo({ top: H(), behavior: 'smooth' }); });
        })();
        (function () {
          var btn = document.getElementById('theme-toggle');
          var icon = btn.querySelector('.theme-toggle__icon');
          function sync() {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            icon.textContent = dark ? '☀️' : '🌙';
          }
          sync();
          btn.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            sync();
          });
        })();
      </script>
    </div>
  </div>
</div>
