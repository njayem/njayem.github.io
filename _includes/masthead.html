{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      </button>
      <button id="to-bottom" class="to-bottom" type="button" aria-label="Go to bottom" title="Go to bottom">↓</button>
      <button id="to-top" class="to-top" type="button" aria-label="Back to top" title="Back to top">↑</button>
      <script>
        (function () {
          var up = document.getElementById('to-top');
          var down = document.getElementById('to-bottom');
          document.body.appendChild(up);
          document.body.appendChild(down);
          function chk() {
            var y = window.pageYOffset || document.documentElement.scrollTop;
            var max = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) - window.innerHeight;
            up.classList.toggle('show', y > 300);
            down.classList.toggle('show', max > 400 && y < max - 300);
          }
          window.addEventListener('scroll', chk, { passive: true });
          window.addEventListener('resize', chk);
          window.addEventListener('load', chk);
          chk();
          up.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
          down.addEventListener('click', function () {
            window.scrollTo({ top: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight), behavior: 'smooth' });
          });
        })();
        (function () {
          var btn = document.getElementById('theme-toggle');
          var icon = btn.querySelector('.theme-toggle__icon');
          function sync() {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            icon.textContent = dark ? '☀️' : '🌙';
          }
          sync();
          btn.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            sync();
          });
        })();
      </script>
    </div>
  </div>
</div>
